[project]
name = "dynasty-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "lifelines>=0.30.3",
    "nflreadpy>=0.1.5",
    "polars>=1.43.1",
    "pyarrow>=25.0.0",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.5",
    "scikit-learn>=1.9.0",
    "statsmodels>=0.14.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
